[project]
name = "ai_research_analyst"
version = "0.1.0"
description = "ai_research_analyst using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.28,<2.0.0",
    "streamlit>=1.65.0",
    "tavily-python>=0.8.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "4c25cdd3-a869-4056-965f-e41c705b12dc"
